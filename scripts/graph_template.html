<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel-2: #23272f; --line: #2f343d;
    --ink: #e6e8ec; --ink-dim: #9aa1ad; --ink-faint: #6b7280;
    --good: #35a06a; --bad: #c0504a; --active: #3d86cc; --pending: #c99a2e; --idle: #6b7280;
    --accent: #7aa7d9;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #ffffff; --panel-2: #eef0f4; --line: #d8dce3;
      --ink: #1a1d22; --ink-dim: #5b6270; --ink-faint: #8a91a0;
      --accent: #275e9c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); }
  #search {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 6px 10px; width: 260px; font: inherit;
  }
  #search:focus { outline: 1px solid var(--accent); }
  .grow { flex: 1; }
  .muted { color: var(--ink-faint); font-size: 12px; }

  .timebar { display: flex; align-items: center; gap: 10px; }
  .timebar input[type=range] { width: 240px; accent-color: var(--accent); }
  #timeLabel { font-variant-numeric: tabular-nums; min-width: 90px; color: var(--ink-dim); font-size: 12px; }

  main { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 208px; flex: none; border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 12px 14px 40px;
  }
  aside h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-faint); margin: 16px 0 7px; font-weight: 600;
  }
  aside h2:first-child { margin-top: 0; }
  .chk { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; font-size: 13px; }
  .chk input { accent-color: var(--accent); margin: 0; }
  .chk .n { margin-left: auto; color: var(--ink-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  aside button {
    margin-top: 14px; width: 100%; background: var(--panel-2); color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px; font: inherit; cursor: pointer;
  }
  aside button:hover { color: var(--ink); }

  #stage { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .lane-band { fill: var(--panel); opacity: .45; }
  .lane-label {
    fill: var(--ink-faint); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .tick-line { stroke: var(--line); stroke-dasharray: 2 5; }
  .tick-text { fill: var(--ink-faint); font-size: 10px; }
  /* Edges are decoration. Letting a fat bezier eat a click aimed at the
     canvas (or at a node it happens to pass over) is maddening. */
  .edge { fill: none; stroke: var(--line); stroke-width: 1.4; pointer-events: none; }
  .edge.lit { stroke: var(--accent); stroke-width: 2.2; }
  .node { cursor: pointer; }
  .node .glyph { stroke: var(--bg); stroke-width: 1.5; }
  /* Clickable: the label is a bigger target than the glyph, and people aim at words. */
  .node .label { fill: var(--ink-dim); font-size: 11px; }
  .node.sel .glyph { stroke: var(--accent); stroke-width: 2.5; }
  .node.sel .label { fill: var(--ink); }
  .node.dim { opacity: .12; }
  .node.terminal .glyph { stroke-dasharray: none; }
  .good { fill: var(--good); } .bad { fill: var(--bad); } .active { fill: var(--active); }
  .pending { fill: var(--pending); } .idle { fill: var(--idle); }

  #panel {
    width: 420px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 18px 20px 60px; display: none;
  }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; }
  #panel h4, #panel h5, #panel h6 { margin: 18px 0 5px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); }
  #panel p, #panel li { color: var(--ink); }
  #panel pre { background: var(--panel-2); padding: 10px; border-radius: 6px; overflow-x: auto; }
  #panel blockquote { border-left: 2px solid var(--line); margin: 8px 0; padding-left: 12px; color: var(--ink-dim); }
  #panel a { color: var(--accent); }
  #panel hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .pillrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--ink-dim); border: 1px solid var(--line);
  }
  .pill.status { color: #fff; border: 0; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 3px 10px; font-size: 12.5px; margin: 10px 0; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; word-break: break-word; }
  .sect { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px; }
  .sect > .hd { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-bottom: 7px; }
  .lnk { display: block; padding: 3px 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  .lnk:hover { text-decoration: underline; }
  .hist { font-size: 12.5px; }
  .hist li { margin-bottom: 4px; list-style: none; }
  .hist .d { color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .hist .future { opacity: .35; } /* entries after the slider's cutoff */
  #close { float: right; background: none; border: 0; color: var(--ink-faint); font-size: 20px; cursor: pointer; line-height: 1; }
  #close:hover { color: var(--ink); }
  .empty { padding: 60px; text-align: center; color: var(--ink-faint); }
  .empty code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Cairn</h1>
  <input id="search" type="search" placeholder="Search titles, ids, projects…" autocomplete="off">
  <span id="count" class="muted"></span>
  <span class="grow"></span>
  <div class="timebar">
    <label class="muted" for="time">as of</label>
    <input id="time" type="range" min="0" max="0" value="0">
    <span id="timeLabel">—</span>
  </div>
</header>

<main>
  <aside>
    <h2>Project</h2><div id="fProject"></div>
    <h2>Type</h2><div id="fType"></div>
    <h2>Status</h2><div id="fStatus"></div>
    <button id="reset">Reset filters</button>
    <h2>Legend</h2>
    <div class="muted" style="line-height:1.9">
      ● experiment &nbsp; ◆ seed<br>▮ direction &nbsp; ■ task<br>⬢ milestone
    </div>
  </aside>

  <div id="stage">
    <svg id="svg"><g id="view"></g></svg>
    <div id="empty" class="empty" hidden>
      <p>No nodes yet.</p>
      <p>Create one with <code>scripts/new_node.py</code>, then <code>make build</code>.</p>
    </div>
  </div>

  <div id="panel"></div>
</main>

<script>
const DATA = /*__CAIRN_DATA__*/null;

const $ = s => document.querySelector(s);
const svg = $('#svg'), view = $('#view'), panel = $('#panel');
const byId = new Map(DATA.nodes.map(n => [n.id, n]));

const state = {
  project: new Set(DATA.nodes.map(n => n.project)),
  type: new Set(DATA.types),
  status: new Set(DATA.statuses),
  query: '',
  t: DATA.dates.length ? DATA.dates.length - 1 : 0,
  selected: null,
};

/* ---------- status as of a date: this is the replay ---------- */
const CLS = {
  worked:'good', done:'good', accepted:'good', promoted:'good',
  dead:'bad', killed:'bad', dropped:'bad', closed:'bad',
  running:'active', doing:'active', submitted:'active',
  open:'pending', todo:'pending', seed:'pending', planned:'pending',
  parked:'idle',
};
const cutoff = () => DATA.dates.length ? DATA.dates[state.t] : '9999-12-31';
const isLive = () => !DATA.dates.length || state.t === DATA.dates.length - 1;

function statusAt(n, when) {
  if (isLive()) return n.status;
  let s = null;
  for (const h of n.history) { if (h.date <= when) s = h.status; }
  return s || (n.created <= when ? n.status : null);
}

function visible(n) {
  const when = cutoff();
  if (!isLive() && n.created > when) return false;
  const s = statusAt(n, when);
  if (s === null) return false;
  if (!state.project.has(n.project)) return false;
  if (!state.type.has(n.type)) return false;
  if (!state.status.has(s)) return false;
  if (state.query) {
    const hay = (n.title + ' ' + n.id + ' ' + n.project + ' ' + n.type).toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

/* ---------- geometry ---------- */
const R = 13;
function glyph(shape) {
  if (shape === 'circle') return `<circle class="glyph" r="${R}"></circle>`;
  if (shape === 'square') return `<rect class="glyph" x="${-R+1}" y="${-R+1}" width="${2*R-2}" height="${2*R-2}" rx="2"></rect>`;
  if (shape === 'rect')   return `<rect class="glyph" x="${-R-5}" y="${-R+4}" width="${2*R+10}" height="${2*R-8}" rx="4"></rect>`;
  if (shape === 'diamond')return `<path class="glyph" d="M0,${-R-2} L${R+2},0 L0,${R+2} L${-R-2},0 Z"></path>`;
  if (shape === 'hex') {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      pts.push(`${(R+2)*Math.cos(a)},${(R+2)*Math.sin(a)}`);
    }
    return `<polygon class="glyph" points="${pts.join(' ')}"></polygon>`;
  }
  return `<circle class="glyph" r="${R}"></circle>`;
}

function edgePath(a, b) {
  const dx = Math.max(30, Math.abs(b.x - a.x) * 0.45);
  return `M${a.x + R},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x - R - 3},${b.y}`;
}

/* ---------- render ---------- */
function draw() {
  const parts = [];

  for (const lane of DATA.lanes) {
    parts.push(`<rect class="lane-band" x="0" y="${lane.top}" width="${DATA.width}" height="${lane.height}"></rect>`);
    parts.push(`<text class="lane-label" x="14" y="${lane.top + 16}">${esc(lane.project)}</text>`);
  }
  for (const tick of DATA.ticks) {
    parts.push(`<line class="tick-line" x1="${tick.x}" y1="30" x2="${tick.x}" y2="${DATA.height - 20}"></line>`);
    parts.push(`<text class="tick-text" x="${tick.x + 4}" y="24">${esc(tick.label)}</text>`);
  }

  const shown = DATA.nodes.filter(visible);
  const shownIds = new Set(shown.map(n => n.id));
  const sel = state.selected;
  const kin = sel ? new Set([sel, ...byId.get(sel).parents, ...byId.get(sel).children]) : null;

  for (const n of shown) {
    for (const p of n.parents) {
      if (!shownIds.has(p)) continue;
      const lit = sel && (n.id === sel || p === sel) ? ' lit' : '';
      parts.push(`<path class="edge${lit}" d="${edgePath(byId.get(p), n)}"></path>`);
    }
  }

  const when = cutoff();
  for (const n of shown) {
    const cls = CLS[statusAt(n, when)] || 'idle';
    const dim = kin && !kin.has(n.id) ? ' dim' : '';
    const on = n.id === sel ? ' sel' : '';
    parts.push(
      `<g class="node ${cls}${dim}${on}" transform="translate(${n.x},${n.y})" data-id="${esc(n.id)}">` +
      glyph(n.shape) +
      `<text class="label" x="${R + 7}" y="4">${esc(n.label)}</text>` +
      `<title>${esc(n.title)}\n${n.type} · ${statusAt(n, when)} · ${n.created}</title>` +
      `</g>`
    );
  }

  view.innerHTML = parts.join('');
  $('#count').textContent = `${shown.length} of ${DATA.nodes.length} nodes`;
  $('#empty').hidden = DATA.nodes.length > 0;
  refreshCounts();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- filters ---------- */
function chk(container, values, key, colour) {
  container.innerHTML = values.map(v =>
    `<label class="chk">` +
    `<input type="checkbox" data-key="${key}" value="${esc(v)}" checked>` +
    (colour ? `<span class="swatch" style="background:var(--${CLS[v] || 'idle'})"></span>` : '') +
    `<span>${esc(v)}</span><span class="n" data-count="${key}:${esc(v)}"></span></label>`
  ).join('');
}

function refreshCounts() {
  const when = cutoff();
  const tally = {};
  for (const n of DATA.nodes) {
    const s = statusAt(n, when);
    if (s === null) continue;
    for (const [k, v] of [['project', n.project], ['type', n.type], ['status', s]]) {
      tally[`${k}:${v}`] = (tally[`${k}:${v}`] || 0) + 1;
    }
  }
  document.querySelectorAll('[data-count]').forEach(el => {
    el.textContent = tally[el.dataset.count] || '';
  });
}

/* ---------- detail panel ---------- */
function open(id) {
  const n = byId.get(id);
  if (!n) return;
  state.selected = id;

  const rows = [];
  const push = (k, v) => v && rows.push(`<dt>${esc(k)}</dt><dd>${v}</dd>`);
  push('id', `<code>${esc(n.id)}</code>`);
  push('created', n.created);
  push('updated', n.updated);
  for (const [k, v] of Object.entries(n.extra)) {
    if (k === 'contacts' && Array.isArray(v)) {
      push('contacts', v.map(c =>
        `${esc(c.name || '')}${c.email ? ` &lt;<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>&gt;` : ''}` +
        `${c.affiliation ? `<span class="muted"> · ${esc(c.affiliation)}</span>` : ''}`
      ).join('<br>'));
    } else if (Array.isArray(v)) {
      push(k, v.map(x => `<code>${esc(x)}</code>`).join('<br>'));
    } else if (k === 'commit' && n.commitUrl) {
      push(k, `<a href="${esc(n.commitUrl)}" target="_blank" rel="noopener"><code>${esc(v)}</code></a>`);
    } else if (k === 'url') {
      push(k, `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`);
    } else {
      push(k, esc(v));
    }
  }

  const section = (title, inner) => inner
    ? `<div class="sect"><div class="hd">${title}</div>${inner}</div>` : '';
  const links = ids => ids.map(i => byId.has(i)
    ? `<span class="lnk" data-goto="${esc(i)}">${esc(byId.get(i).title)}</span>` : '').join('');

  // When the slider is rewound, the panel must agree with the map — showing
  // today's status next to a 3-months-ago graph is how you misread history.
  const when = cutoff();
  const shownStatus = statusAt(n, when) || n.status;

  panel.innerHTML =
    `<button id="close" title="Close (Esc)">×</button>` +
    `<h3>${esc(n.title)}</h3>` +
    `<div class="pillrow">` +
      `<span class="pill status" style="background:var(--${CLS[shownStatus] || 'idle'})">${esc(shownStatus)}</span>` +
      `<span class="pill">${esc(n.type)}</span><span class="pill">${esc(n.project)}</span>` +
      (isLive() ? '' : `<span class="pill">as of ${esc(when)}</span>`) +
    `</div>` +
    `<dl class="kv">${rows.join('')}</dl>` +
    `<div class="body">${n.body}</div>` +
    section('Parents', links(n.parents)) +
    section('Children', links(n.children)) +
    section('References', n.refs.map(r =>
      `<div style="margin-bottom:6px"><a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.title || r.doi)}</a>` +
      (r.cocited.length ? `<div class="muted">also cited by ${r.cocited.length} other node(s)</div>` : '') + `</div>`
    ).join('')) +
    section('History', `<ul class="hist" style="padding-left:0;margin:0">` + n.history.map(h =>
      `<li${h.date > when ? ' class="future"' : ''}>` +
      `<span class="d">${esc(h.date)}</span><strong>${esc(h.status)}</strong>` +
      (h.note ? ` — ${esc(h.note)}` : '') + `</li>`).join('') + `</ul>`);

  panel.classList.add('open');
  panel.scrollTop = 0;
  history.replaceState(null, '', '#' + id);
  draw();
}

function close() {
  state.selected = null;
  panel.classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
  draw();
}

/* ---------- pan / zoom ---------- */
let tx = 0, ty = 0, scale = 1;
const applyTransform = () => view.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const next = Math.min(2.4, Math.max(0.18, scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  applyTransform();
}, { passive: false });

let dragging = false, moved = false, ox = 0, oy = 0, hit = null;
svg.addEventListener('pointerdown', e => {
  // Capture retargets every later pointer event to the <svg>, so the node
  // under the cursor has to be recorded here, before capture is taken.
  hit = e.target.closest('.node');
  dragging = true; moved = false; ox = e.clientX - tx; oy = e.clientY - ty;
  svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const nx = e.clientX - ox, ny = e.clientY - oy;
  if (Math.abs(nx - tx) + Math.abs(ny - ty) > 3) moved = true;
  tx = nx; ty = ny; applyTransform();
});
svg.addEventListener('pointerup', () => {
  dragging = false; svg.classList.remove('dragging');
  if (moved) { hit = null; return; }
  if (hit) open(hit.dataset.id); else if (state.selected) close();
  hit = null;
});

function fit() {
  const rect = svg.getBoundingClientRect();
  scale = Math.min(
    1,
    Math.max(0.15, (rect.width - 36) / Math.max(DATA.width, 1)),
    Math.max(0.15, (rect.height - 36) / Math.max(DATA.height, 1)),
  );
  tx = 18;
  // Centre vertically when the graph is shorter than the viewport, so a small
  // graph doesn't hug the top edge with dead space beneath it.
  ty = Math.max(10, (rect.height - DATA.height * scale) / 2);
  applyTransform();
}

/* ---------- wiring ---------- */
chk($('#fProject'), [...new Set(DATA.nodes.map(n => n.project))].sort(), 'project', false);
chk($('#fType'), DATA.types, 'type', false);
chk($('#fStatus'), DATA.statuses, 'status', true);

document.addEventListener('change', e => {
  const key = e.target.dataset?.key;
  if (!key) return;
  e.target.checked ? state[key].add(e.target.value) : state[key].delete(e.target.value);
  draw();
});

$('#reset').onclick = () => {
  document.querySelectorAll('.chk input').forEach(i => { i.checked = true; state[i.dataset.key].add(i.value); });
  $('#search').value = ''; state.query = '';
  $('#time').value = state.t = Math.max(0, DATA.dates.length - 1);
  updateTimeLabel(); draw(); fit();
};

$('#search').addEventListener('input', e => { state.query = e.target.value.trim().toLowerCase(); draw(); });

const timeInput = $('#time');
timeInput.max = Math.max(0, DATA.dates.length - 1);
timeInput.value = state.t;
function updateTimeLabel() {
  $('#timeLabel').textContent = DATA.dates.length ? (isLive() ? 'now' : DATA.dates[state.t]) : '—';
}
timeInput.addEventListener('input', e => {
  state.t = +e.target.value;
  updateTimeLabel();
  if (!state.selected) draw();
  else if (visible(byId.get(state.selected))) open(state.selected);  // re-render as-of
  else close();
});

document.addEventListener('click', e => {
  if (e.target.id === 'close') return close();
  const goto = e.target.dataset?.goto;
  if (goto) open(goto);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if (e.key === '/' && document.activeElement !== $('#search')) { e.preventDefault(); $('#search').focus(); }
});

/* URL: #node-id selects, ?since=YYYY-MM-DD or ?t= rewinds, ?project= filters */
(function initFromUrl() {
  const params = new URLSearchParams(location.search);
  const since = params.get('since') || params.get('t');
  if (since && DATA.dates.length) {
    let index = DATA.dates.findIndex(d => d > since);
    state.t = index === -1 ? DATA.dates.length - 1 : Math.max(0, index - 1);
    timeInput.value = state.t;
  }
  const project = params.get('project');
  if (project) {
    state.project = new Set([project]);
    document.querySelectorAll('[data-key=project]').forEach(i => { i.checked = i.value === project; });
  }
})();

updateTimeLabel();
draw();
fit();
if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));
window.addEventListener('resize', () => { if (scale <= 1) fit(); });
</script>
</body>
</html>

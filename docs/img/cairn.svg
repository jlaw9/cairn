<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 82" width="64" height="82" role="img" aria-label="Cairn — a stack of balanced stones">
  <!-- colors from scripts/graph_template.html, so mark, map and deck stay one system -->
  <style>
    .stone { fill: #1a1d22; }
    .stone.a { fill: #275e9c; }
    @media (prefers-color-scheme: dark) {
      .stone { fill: #e6e8ec; }
      .stone.a { fill: #7aa7d9; }
    }
  </style>
  <ellipse class="stone a" cx="33" cy="13" rx="14" ry="7.5" transform="rotate(-7 33 13)"/>
  <ellipse class="stone"   cx="31" cy="31" rx="20" ry="9"   transform="rotate(4 31 31)"/>
  <ellipse class="stone"   cx="33" cy="51" rx="26" ry="10"  transform="rotate(-3 33 51)"/>
  <ellipse class="stone"   cx="32" cy="71" rx="20" ry="8"   transform="rotate(2 32 71)"/>
</svg>

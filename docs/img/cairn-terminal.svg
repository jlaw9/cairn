<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="Cairn — ASCII cairn in a terminal window">
  <!-- Deliberately single-theme: it is a dark terminal on either ground.
       Colors from scripts/graph_template.html (dark palette). -->
  <rect x="1" y="1" width="198" height="148" rx="10" fill="#1c1f25" stroke="#2f343d" stroke-width="2"/>
  <circle cx="18" cy="15" r="4.5" fill="#c0504a"/>
  <circle cx="33" cy="15" r="4.5" fill="#c99a2e"/>
  <circle cx="48" cy="15" r="4.5" fill="#35a06a"/>
  <line x1="2" y1="28" x2="198" y2="28" stroke="#2f343d" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="14" y="48" font-size="11"><tspan fill="#35a06a">$</tspan><tspan fill="#e6e8ec"> cairn</tspan></text>
    <g font-size="13" text-anchor="middle">
      <text x="100" y="74"  fill="#7aa7d9">(__)</text>
      <text x="100" y="88"  fill="#e6e8ec">(____)</text>
      <text x="100" y="102" fill="#e6e8ec">(______)</text>
      <text x="100" y="116" fill="#e6e8ec">(____)</text>
    </g>
    <text x="14" y="139" font-size="11" fill="#35a06a">$</text>
  </g>
  <rect x="26" y="129" width="7" height="12" fill="#7aa7d9"/>
</svg>
